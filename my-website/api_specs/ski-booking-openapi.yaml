openapi: 3.0.3
info:
  title: Ski Instructor Booking API
  version: 1.0.0
  description: API для онлайн-записи клиентов к инструкторам горнолыжного курорта.

servers:
  - url: https://api.example.com/v1

paths:
  /services:
    get:
      summary: Получение списка услуг
      responses:
        '200':
          description: Список услуг успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "Занятие с инструктором"